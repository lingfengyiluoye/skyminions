# ============================================================
#  SkyMinions GUI 文案配置
# ------------------------------------------------------------
#  · 模板支持 MiniMessage 颜色标签: <gold> <green> <gray>
#    <dark_gray> <yellow> <red> <aqua> <light_purple> <white> ...
#  · {xxx} 为占位符, 打开 GUI 时由插件替换为实际数值
#  · 【可选行】lore 行内若有"当前不适用"的占位符, 整行自动隐藏
#    (例如未配置稀有掉落时, 信息卡的稀有掉落行不会显示)
#  · 修改后执行 /minion reload 热重载即可生效
#    (GUI 顶部标题随仆从实例创建, 重新放置仆从后更新)
#  · 删除任意键可回退到内置默认文案
# ============================================================

# GUI 顶部标题。占位符: {name}=类型中文名（类型名本身已含"仆从"后缀，直接展示）
title: "{name}"

# 信息书(槽3)。占位符: {name} {tier} {speed}=秒/次 {rate}=件/小时 {range}=范围
#   {storage}=仓存件数 {slots}=已解锁格数 {total}=累计产出 {next}=距下次工作秒数 {status}=状态行
#   可选: {rare}=稀有掉落物 {rare_chance}=几率%(仅配置了稀有掉落的类型提供)
#   可选: {halted_tip} 停工恢复提示行（仅仓库满停工时显示）
#   可选: {next_tier}+{unlock_mats} 下一档解锁行（仅配置 targets-by-tier 且仍有未解锁档时显示）
info:
  title: "<gold>✦ {name} · 等级 {tier}</gold>"
  lore:
    - "<gray>状态: {status}</gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<dark_gray>速度 <green>{speed} 秒/次</green></dark_gray>"
    - "<dark_gray>产出 <green>≈ {rate} 件/小时</green></dark_gray>"
    - "<dark_gray>范围 <aqua>{range}</aqua></dark_gray>"
    - "<dark_gray>{next_tier} 级解锁 <yellow>{unlock_mats}</yellow></dark_gray>"
    - "<dark_gray>存储 <white>{storage} 件 / {slots} 格</white></dark_gray>"
    - "<dark_gray>稀有掉落 <light_purple>{rare} ({rare_chance}%)</light_purple></dark_gray>"
    - "<dark_gray>取货或开启 <gold>自动售卖</gold> 后恢复工作{halted_tip}</dark_gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<dark_gray>累计产出 <yellow>{total} 件</yellow></dark_gray>"
    - "<dark_gray>下次工作 <green>{next} 秒后</green></dark_gray>"

# 仆从头颅(槽4)。占位符: {name} {tier} {owner}=主人名 {skin}=皮肤名
head:
  title: "<yellow>{name} · 等级 {tier}</yellow>"
  lore:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<dark_gray>主人: <white>{owner}</white></dark_gray>"
    - "<dark_gray>皮肤: <light_purple>{skin}</light_purple></dark_gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<gray>放置于私岛自动采集资源</gray>"
    - "<dark_gray>右键打开仓库 · 潜行右键拾取</dark_gray>"

# 升级按钮(槽5) - 材料充足。占位符: {tier}=目标等级 {speed_now} {speed_next}=秒/次
#   {m1}~{m3}=逐行材料对比(需求/已有, 行内自带颜色), 配方不足 3 种时多余行自动隐藏
upgrade:
  title: "<gold>升级到等级 {tier}</gold>"
  lore:
    - "<dark_gray>速度: <gray>{speed_now}秒</gray> <dark_gray>→</dark_gray> <green>{speed_next}秒</green> <dark_gray>/次</dark_gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "{m1}"
    - "{m2}"
    - "{m3}"
    - "{m4}"
    - "{body}"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<yellow>点击打开升级合成界面 ▶</yellow>"

# 升级按钮(槽5) - 材料不足。占位符同 upgrade
upgrade-lack:
  title: "<gold>升级到等级 {tier}</gold>"
  lore:
    - "<dark_gray>速度: <gray>{speed_now}秒</gray> <dark_gray>→</dark_gray> <green>{speed_next}秒</green> <dark_gray>/次</dark_gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "{m1}"
    - "{m2}"
    - "{m3}"
    - "{m4}"
    - "{body}"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<gray>点击打开升级合成界面（材料需放入合成格）</gray>"

# 升级按钮(槽5) - 已满级。占位符: {tier}=最大等级
upgrade-max:
  title: "<gold>升级</gold>"
  lore:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<red>已达最高等级</red>"
    - "<gray>最高等级（{tier}）</gray>"

# 燃料槽状态卡(槽0, 按钮)。图标随状态: 无燃料=煤炭 / 限时生效中=烈焰棒 / 永久生效中=岩浆桶。
# 交互: 手持有效燃料点击此槽立即生效(限时整组、永久仅1个); 空手点击查看燃料指引。占位符:
#   可选: {perm}=永久加速百分比(仅佩戴永久燃料时提供)
#         {left}=限时剩余秒 {timed}=限时加速百分比(仅限时燃料生效时提供)
#         {nofuel}=空占位(仅完全无燃料时提供, 用于条件显示提示行)
fuel:
  title: "<gray>燃料槽</gray>"
  lore:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<dark_gray>永久加速 <green>+{perm}%</green></dark_gray>"
    - "<dark_gray>限时剩余 <yellow>{left} 秒</yellow> <green>({timed}%)</green></dark_gray>"
    - "<dark_gray>产出倍率 <light_purple>{mult}</light_purple></dark_gray>"
    - "<gray>{nofuel}当前无燃料（仆从仍会工作）</gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<yellow>⚡ 手持燃料点击此槽 · 立即生效</yellow>"
    - "<dark_gray>限时: <gray>煤炭/岩浆桶/烈焰棒</gray></dark_gray>"
    - "<dark_gray>永久: <gray>岩浆膏/荧石粉/日光传感器</gray></dark_gray>"
    - "<dark_gray>空手点击查看燃料指引 · 手持燃料右键小人也可添加（每次 1 个）</dark_gray>"
    - "<dark_gray>永久燃料不可卸下，多次安装取最高加速</dark_gray>"

# 皮肤卡(槽7)。占位符: {current}=当前皮肤 {next}=下一个皮肤(仅有多皮肤时提供)
skin:
  title: "<light_purple>皮肤</light_purple>"
  lore:
    - "<dark_gray>当前: <light_purple>{current}</light_purple></dark_gray>"
    - "<dark_gray>下一个: <gray>{next}</gray></dark_gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<yellow>点击切换 ▶</yellow>"

# 模块槽(槽47/48) - 未解锁。占位符: {n}=槽序号 {tier}=解锁等级
module-locked:
  title: "<dark_gray>模块槽 #{n}</dark_gray>"
  lore:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<red>✖ 未解锁</red>"
    - "<gray>升级到等级 {tier} 解锁</gray>"

# 模块槽 - 已装备。占位符: {name}=模块名 {desc}=模块描述
module-equipped:
  title: "<aqua>{name}</aqua>"
  lore:
    - "<gray>{desc}</gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<green>● 已装备</green>"
    - "<yellow>空手点击卸下 ▶</yellow>"

# 模块槽 - 空。占位符: {n}=槽序号
module-empty:
  title: "<gray>模块槽 #{n}</gray>"
  lore:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<dark_gray>○ 空</dark_gray>"
    - "<gray>手持模块物品点击装备</gray>"
    - "<dark_gray>可用 /minion upgrade 获取</dark_gray>"

# 收集全部(槽49)。占位符: {count}=仓存件数
collect:
  title: "<gold>收集全部</gold>"
  lore:
    - "<gray>将仓库所有物品转移到背包</gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<dark_gray>当前仓存: <yellow>{count} 件</yellow></dark_gray>"
    - "<yellow>点击收集 ▶</yellow>"

# 自动售卖(槽50)。无占位符
autosell-on:
  title: "<green>自动售卖</green>"
  lore:
    - "<dark_gray>状态: <green>● 开启</green></dark_gray>"
    - "<gray>仓库满时自动卖给商人</gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<yellow>点击关闭</yellow>"

autosell-off:
  title: "<gray>自动售卖</gray>"
  lore:
    - "<dark_gray>状态: <red>○ 关闭</red></dark_gray>"
    - "<gray>仓库满时停止工作</gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<yellow>点击开启</yellow>"

# 理想布局(槽51)。占位符: {side}=范围边长 {layout_hint}=按类型的布局提示
# 可选: {on}=开启状态行 / {off}=关闭状态行（仅支持自动布局的类型提供: 圆石/农夫）
layout:
  title: "<aqua>理想布局</aqua>"
  lore:
    - "<dark_gray>工作范围 <white>{side}x{side}</white></dark_gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<green>{on}● 自动布局运行中</green>"
    - "<gray>{off}○ 点击开启自动布局</gray>"
    - "<dark_gray>{layout_hint}</dark_gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<gray>· 中心留空放置仆从</gray>"
    - "<gray>· 保证光照防刷怪促生长</gray>"
    - "<dark_gray>· 关闭或拾取时自动还原摆放</dark_gray>"

# 拾取仆从(槽52)。无占位符
pickup:
  title: "<red>拾取仆从</red>"
  lore:
    - "<gray>移除仆从并收回物品栏</gray>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<dark_gray>仓库、模块与皮肤会保留</dark_gray>"
    - "<dark_gray>潜行+右键仆从也可拾取</dark_gray>"
    - "<yellow>点击拾取 ▶</yellow>"

# 关闭(槽53)。无占位符
close:
  title: "<red>关闭</red>"

# 未解锁的仓库锁定格。无占位符
locked-slot:
  title: "<dark_gray>锁定槽位</dark_gray>"
  lore:
    - "<gray>升级仆从以解锁更多存储</gray>"

# ============================================================
#  图鉴 GUI（/minions 打开，6 行 54 格）
# ============================================================
collection-gui:
  title: "<aqua>仆从图鉴</aqua>"
  close:
    title: "<red>关闭</red>"
  # 顶行分类过滤按钮。占位符: {sel}=选中标记 {name}=分类名
  filter:
    title: "<aqua>{sel}{name}</aqua>"
  # 已解锁卡片。占位符: {name} {category} {tier}=最高等级 {max_tier} {placed}=已放置数
  #   {produced}=总产出 {product}=产物名 {collected}=产物收集量
  #   可选: {r1}~{r3}=下一级配方行（未满级时提供）
  card:
    title: "<gold>{name}</gold>"
    lore:
      - "<dark_gray>分类: <aqua>{category}</aqua></dark_gray>"
      - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
      - "<dark_gray>已解锁等级 <yellow>{tier} / {max_tier}</yellow></dark_gray>"
      - "<dark_gray>已放置 <white>{placed} 个</white></dark_gray>"
      - "<dark_gray>总产出 <yellow>{produced} 件</yellow></dark_gray>"
      - "<dark_gray>收集 <white>{product}</white> <yellow>{collected}</yellow></dark_gray>"
      - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
      - "<gray>下一级配方:</gray>"
      - "{r1}"
      - "{r2}"
      - "{r3}"
      - "<yellow>点击打开升级合成界面 ▶</yellow>"
  # 未解锁卡片（???）。占位符: {category} {product} {collected} {need}
  locked:
    title: "<dark_gray>???</dark_gray>"
    lore:
      - "<dark_gray>分类: <aqua>{category}</aqua></dark_gray>"
      - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
      - "<red>✖ 未解锁</red>"
      - "<dark_gray>收集 <white>{product}</white> <yellow>{collected} / {need}</yellow></dark_gray>"
  prev:
    title: "<green>◀ 上一页</green>"
  next:
    title: "<green>下一页 ▶</green>"
  # 底行进度卡。占位符: {unlocked}=已解锁类型数 {total}=类型总数 {page} {pages}
  progress:
    title: "<gold>图鉴进度 {unlocked}/{total}</gold>"
    lore:
      - "<dark_gray>第 <white>{page} / {pages}</white> 页</dark_gray>"
      - "<gray>收集资源解锁更多仆从类型</gray>"
  # 点击卡片后的聊天栏配方标题。占位符: {name} {tier}
  recipe-header:
    title: "<gold>▼ {name} · 下一级配方</gold>"
  recipe-none:
    title: "<gray>尚未放置过该类型仆从，暂无升级记录</gray>"
  recipe-max:
    title: "<green>已达最高等级（{tier}）</green>"

# ============================================================
#  燃料选择 GUI（空手点击仆从燃料槽打开，3 行 27 格）
# ============================================================
fuel-gui:
  title: "<gold>选择燃料</gold>"
  empty:
    title: "<gray>背包中没有可用燃料</gray>"
  # 燃料选项。占位符: {name} {boost}=加速% {mult}=产量倍率 {duration}=持续时间 {count}=背包数量
  option:
    title: "<yellow>{name}</yellow>"
    lore:
      - "<dark_gray>加速 <green>+{boost}%</green></dark_gray>"
      - "<dark_gray>产出 <light_purple>{mult}</light_purple></dark_gray>"
      - "<dark_gray>持续 <white>{duration}</white> / 个</dark_gray>"
      - "<dark_gray>背包数量 <yellow>{count}</yellow></dark_gray>"
      - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
      - "<yellow>点击安装全部 · 潜行安装 1 个</yellow>"
  # 当前燃料状态卡。可选: {perm}=永久加速% {left}=限时剩余 {none}=无燃料时提供
  status:
    title: "<gray>当前燃料状态</gray>"
    lore:
      - "<dark_gray>永久加速 <green>+{perm}%</green></dark_gray>"
      - "<dark_gray>限时剩余 <yellow>{left}</yellow></dark_gray>"
      - "<gray>{none}当前无燃料</gray>"
      - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
      - "<dark_gray>潜行点击卸下限时燃料（永久燃料不可卸下）</dark_gray>"

# ============================================================
#  升级合成 GUI（点击仆从界面升级按钮打开，6 行 54 格，Hypixel 式合成玩法）
# ------------------------------------------------------------
#  把「上一级仆从本体 + 升级材料」放入 3×3 合成格，点击右侧产物合成下一 Tier。
#  配方来自 config.yml types.<类型>.upgrade-recipe（材料随等级按 upgrade-cost-growth 陡增），
#  是否需本体由 upgrade-require-previous-body 开关决定。
# ============================================================
craft-gui:
  # 界面标题。占位符: {name}=类型名 {tier}=当前等级
  title: "<gold>升级合成 · {name} 等级 {tier}</gold>"
  # 顶行配方信息卡。占位符: {tier}=当前等级 {next}=目标等级
  #   {m1}~{m3}=逐材料需求/已放对比行, 可选 {body}=本体需求行(仅开关开启时提供)
  info:
    title: "<gold>升级配方 · 等级 {tier} → {next}</gold>"
    lore:
      - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
      - "{m1}"
      - "{m2}"
      - "{m3}"
      - "{m4}"
      - "{body}"
      - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
      - "<gray>把材料与本体放入左侧合成格</gray>"
      - "<yellow>材料齐后点击右侧产物合成 ▶</yellow>"
  # 结果槽占位（材料未集齐时显示）
  result-lack:
    title: "<gray>材料未集齐</gray>"
    lore:
      - "<gray>按左侧配方放入材料与本体</gray>"
      - "<yellow>潜行点击信息卡可一键填充</yellow>"
  arrow:
    title: "<gray>合成</gray>"
  back:
    title: "<yellow>◀ 返回仆从界面</yellow>"
  # 材料指南按钮：点击打开图形化合成预览界面
  guide:
    title: "<gold>材料指南</gold>"
    lore:
      - "<gray>查看本级材料的获取方式</gray>"
      - "<dark_gray>合成配方 / 原版名称 / 其他来源</dark_gray>"
      - "<yellow>点击后打开图形化合成预览 ▶</yellow>"

# ============================================================
#  材料合成预览 GUI（45 格，纯展示防刷）
# ------------------------------------------------------------
#  · 中央 3×3 按原版摆法显示原料图标 → 箭头 → 成品
#  · ◀ ▶ 在本级多种材料间切换；信息卡显示原版名称与获取途径
#  · 整个视图不可取放（防刷）
# ============================================================
preview:
  title: "<gold>{name} · 合成预览</gold>"
  info:
    title: "<gold>材料信息</gold>"
  info-vanilla: "<dark_gray>原版名称: <white>{vanilla}</white></dark_gray>"
  info-howto: "<dark_gray>获取: <green>{howto}</green></dark_gray>"
  arrow:
    title: "<yellow>合成 →</yellow>"
  prev:
    title: "<green>◀ 上一种材料</green>"
  next:
    title: "<green>下一种材料 ▶</green>"
  close:
    title: "<red>关闭</red>"
  nocraft:
    title: "<red>不可合成</red>"

  # ============================================================
  #  材料指南清单 GUI（27 格，两级导航第一级）
  # ------------------------------------------------------------
  #  · 中行展示本级全部升级材料（需求量 + 已有数量）
  #  · 可合成材料：点击进入图形化合成预览
  #  · 不可合成材料：点击无反应（点不开）
  # ============================================================
  guide-list:
    title: "<gold>材料指南 · {name}</gold> <dark_gray>{tier}→{next}</dark_gray>"
    item:
      name-craft: "<yellow>{material} ×{need}</yellow>"
      name-nocraft: "<gray>{material} ×{need}</gray>"
      lore-craft:
        - "<dark_gray>原版：{vanilla}</dark_gray>"
        - "<dark_gray>已有: <white>{owned}</white></dark_gray>"
        - "<green>▶ 点击查看合成方式</green>"
      lore-nocraft:
        - "<dark_gray>原版：{vanilla}</dark_gray>"
        - "<dark_gray>已有: <white>{owned}</white></dark_gray>"
        - "<red>不可合成</red>"
        - "<dark_gray>{source}</dark_gray>"
    close:
      title: "<red>关闭</red>"

# ============================================================
#  GUI 布局配置（槽位与图标材质，与文案同样支持热重载）
# ------------------------------------------------------------
#  · 槽位: 整数或 "a-b" 区间字符串, 如 [9-44, 49]
#  · 材质: 大写物品名, 如 GOLD_INGOT / ARMOR_STAND
#  · 删除任意键即回退内置默认; 越界/无效值会告警并回退
#  · 仓库/图鉴/升级合成为 54 格界面, 燃料选择为 27 格界面
#  · 布局变化在下次打开对应 GUI 时生效
# ============================================================
layout:
  # ---- 仆从仓库 GUI（54 格） ----
  storage:
    slots: [9-44]                      # 存储区 36 格（按 Tier 逐级解锁）
    decor:
      slots: [1, 8, 45, 48, 52, 53]      # 装饰玻璃槽
      material: BLACK_STAINED_GLASS_PANE
    locked:
      material: BLACK_STAINED_GLASS_PANE  # 黑玻璃锁定格（对齐 Hypixel）
    fuel:
      slot: 0                          # 燃料状态卡（图标随状态变化，不可改）
    info:
      slot: 6
      material: BOOK
    head:
      slot: 4                          # 头颅（图标为仆从皮肤头颅，不可改）
    upgrade:
      slot: 5
      material-ok: GOLD_INGOT          # 材料充足
      material-lack: FURNACE           # 材料不足
      material-max: GOLD_INGOT         # 已满级
    skin:
      slot: 7
      material: LEATHER_HELMET
    module1:
      slot: 2                          # 模块槽 1（头颅左侧，对齐 Hypixel；Tier 4 解锁）
    module2:
      slot: 3                          # 模块槽 2（Tier 8 解锁）
    module-empty:
      material: HOPPER                 # 空模块槽图标
    collect:
      slot: 49                         # 收集全部（居中）
      material: GOLD_BLOCK
    autosell:
      slot: 47
      material-on: EMERALD
      material-off: GOLD_INGOT
    layout:
      slot: 46                         # 理想布局
      material: MAP
    pickup:
      slot: 50
      material: ARMOR_STAND
    close:
      slot: 51
      material: BARRIER

  # ---- 图鉴 GUI（/minions，54 格） ----
  collection:
    all:
      slot: 0                          # 「全部」过滤按钮
      material: BOOK
    filter:
      slots: [1, 2, 3, 4, 5, 6]        # 分类过滤槽（按采矿/农业/伐木/战斗/钓鱼/特殊顺序）
    icon:
      mining: DIAMOND_PICKAXE
      farming: GOLDEN_HOE
      foraging: IRON_AXE
      combat: DIAMOND_SWORD
      fishing: FISHING_ROD
      special: NETHER_STAR
    card:
      slots: [9-44]                    # 卡片区（长度决定每页展示数）
    locked:
      material: BARRIER                # 未解锁卡片 ???
    prev:
      slot: 48
      material: ARROW
    progress:
      slot: 49
      material: BOOK
    next:
      slot: 50
      material: ARROW
    close:
      slot: 8
      material: BARRIER

  # ---- 燃料选择 GUI（27 格） ----
  fuel-gui:
    option:
      slots: [10, 11, 12, 13, 14, 15, 16]
    empty:
      material: GRAY_STAINED_GLASS_PANE  # 背包无燃料时的占位格
    status:
      slot: 22                         # 当前燃料状态卡
    close:
      slot: 26
      material: BARRIER

  # ---- 升级合成 GUI（54 格） ----
  craft:
    grid:
      slots: [11, 12, 13, 20, 21, 22, 29, 30, 31]  # 3×3 合成格（自由取放）
    arrow:
      slot: 23                         # 合成箭头（装饰）
      material: ARROW
    result:
      slot: 24                         # 结果槽：材料齐时显示下一级仆从，点击合成
    info:
      slot: 4                          # 配方信息卡（潜行点击 = 从背包一键填充）
    back:
      slot: 49
      material: ARROW
    guide:
      slot: 45                          # 材料指南按钮：点击打开图形化合成预览
      material: BOOK
    decor:
      slots: [0-3, 5-10, 14-19, 25-28, 32-44, 50-53]
      material: BLACK_STAINED_GLASS_PANE
    lack:
      material: GRAY_STAINED_GLASS_PANE  # 材料未集齐时的结果槽占位

  # ---- 材料合成预览 GUI（45 格，纯展示防刷） ----
  preview:
    grid:
      slots: [20, 21, 22, 29, 30, 31, 38, 39, 40]   # 3×3 摆法（按原版配方位置）
    arrow:
      slot: 32                          # 合成箭头
      material: ARROW
    result:
      slot: 34                          # 成品展示槽（不可取）
    info:
      slot: 4                           # 材料信息卡（原版名称/获取途径/页码）
      material: BOOK
    prev:
      slot: 9                           # ◀ 上一种材料
      material: ARROW
    next:
      slot: 17                          # ▶ 下一种材料
      material: ARROW
    close:
      slot: 44
      material: BARRIER
    nocraft:
      material: BARRIER                 # 不可合成材料的网格占位
    decor:
      slots: [0-3, 5-8, 10-16, 18-19, 23-28, 33, 35-37, 41-43]
      material: BLACK_STAINED_GLASS_PANE

  # ---- 材料指南清单 GUI（27 格，两级导航第一级） ----
  guide-list:
    material:
      slots: [10, 11, 12, 13, 14, 15, 16]   # 材料条目（≤7 种；点击可合成项进入预览）
    close:
      slot: 22
      material: BARRIER
    decor:
      slots: [0-9, 17-21, 23-26]
      material: BLACK_STAINED_GLASS_PANE
