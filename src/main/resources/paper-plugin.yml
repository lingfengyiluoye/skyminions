name: SkyMinions
version: "1.0.0"
main: com.hcs.minions.MinionsPlugin
api-version: "1.21"
description: SkyMinions 仆从系统（Hypixel 风格）
authors: [hcs]

# 可选软依赖：缺失时插件仍可运行，仅关闭对应能力
dependencies:
  - name: Vault
    required: false
  - name: SuperiorSkyblock2
    required: false
  # CraftEngine：升级配方可用 "craftengine:<id>" 自定义物品作材料（未安装时自动降级为仅原版材料）
  - name: CraftEngine
    required: false

# 运行时依赖：由 Paper 在加载插件时从 Maven Central 自动下载并挂载到插件类加载器，
# 因此 jar 无需打包这些库（保持瘦 jar）。
libraries:
  - it.unimi.dsi:fastutil:8.5.15
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.46.0.0
  - com.mysql:mysql-connector-j:8.4.0
  - com.google.protobuf:protobuf-java:3.25.1

# 权限说明（LuckPerms 联动）：
#   注意：paper-plugin.yml 不支持 permissions 声明段（Paper 限制），
#   全部节点由 core/PermissionRegistry 在 onEnable 程序化注册，因此：
#     · /lp tree 与 LuckPerms 编辑器中搜索 minions 即可看到全部节点
#     · minions.admin 默认 op；minions.use 与全部 type.<类型中文名> 默认 true
#     · minions.limit.<n> 为动态数字节点（取最大 n），按需在 LuckPerms 授予
