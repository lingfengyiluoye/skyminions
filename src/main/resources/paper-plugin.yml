name: SkyMinions
version: "1.0.0"
main: com.hcs.minions.MinionsPlugin
api-version: "1.21"
description: SkyMinions 仆从系统（Hypixel 风格）
authors: [hcs]

# 可选软依赖：缺失时插件仍可运行，仅关闭对应能力
dependencies:
  - name: Vault
    required: false
  - name: SuperiorSkyblock2
    required: false
  # CraftEngine：升级配方可用 "craftengine:<id>" 自定义物品作材料（未安装时自动降级为仅原版材料）
  - name: CraftEngine
    required: false

# 运行时依赖：由 Paper 在加载插件时从 Maven Central 自动下载并挂载到插件类加载器，
# 因此 jar 无需打包这些库（保持瘦 jar）。
libraries:
  - it.unimi.dsi:fastutil:8.5.15
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.46.0.0
  - com.mysql:mysql-connector-j:8.4.0
  - com.google.protobuf:protobuf-java:3.25.1

# 权限（LuckPerms 会自动接管这些 Bukkit 权限）：
#   hcs.minions.admin         管理权限（op 默认拥有）
#   hcs.minions.use          使用仆从（默认人人有）
#   hcs.minions.type.<type>   可使用某类仆从（miner/farmer/lumberjack/fisher/slayer/rancher/cobble，默认均为 true）
#   hcs.minions.limit.<n>     仆从数量上限（取拥有的最大 n，如 hcs.minions.limit.20）
permissions:
  hcs.minions.admin:
    description: 仆从系统管理权限
    default: op
  hcs.minions.use:
    description: 使用仆从
    default: true
  hcs.minions.type.煤矿仆从:
    description: 使用矿工仆从
    default: true
  hcs.minions.type.小麦仆从:
    description: 使用农夫仆从
    default: true
  hcs.minions.type.橡木仆从:
    description: 使用伐木工仆从
    default: true
  hcs.minions.type.钓鱼仆从:
    description: 使用钓鱼仆从
    default: true
  hcs.minions.type.僵尸仆从:
    description: 使用猎魔仆从
    default: true
  hcs.minions.type.牛仆从:
    description: 使用牧民仆从
    default: true
  hcs.minions.type.圆石仆从:
    description: 使用圆石仆从
    default: true
  # ---- 扩展类型（配置驱动，一种资源一个仆从；默认全员可用，可用 LuckPerms 收紧） ----
  hcs.minions.type.铁矿仆从: {description: 铁矿仆从, default: true}
  hcs.minions.type.铜矿仆从: {description: 铜矿仆从, default: true}
  hcs.minions.type.金矿仆从: {description: 金矿仆从, default: true}
  hcs.minions.type.红石仆从: {description: 红石仆从, default: true}
  hcs.minions.type.青金石仆从: {description: 青金仆从, default: true}
  hcs.minions.type.钻石仆从: {description: 钻石仆从, default: true}
  hcs.minions.type.绿宝石仆从: {description: 绿宝仆从, default: true}
  hcs.minions.type.石英仆从: {description: 石英仆从, default: true}
  hcs.minions.type.黑曜石仆从: {description: 黑曜仆从, default: true}
  hcs.minions.type.胡萝卜仆从: {description: 胡萝卜仆从, default: true}
  hcs.minions.type.马铃薯仆从: {description: 马铃薯仆从, default: true}
  hcs.minions.type.南瓜仆从: {description: 南瓜仆从, default: true}
  hcs.minions.type.西瓜仆从: {description: 西瓜仆从, default: true}
  hcs.minions.type.甜菜仆从: {description: 甜菜仆从, default: true}
  hcs.minions.type.可可仆从: {description: 可可仆从, default: true}
  hcs.minions.type.下界疣仆从: {description: 下界疣仆从, default: true}
  hcs.minions.type.白桦仆从: {description: 白桦仆从, default: true}
  hcs.minions.type.云杉仆从: {description: 云杉仆从, default: true}
  hcs.minions.type.丛林仆从: {description: 丛林仆从, default: true}
  hcs.minions.type.金合欢仆从: {description: 金合欢仆从, default: true}
  hcs.minions.type.深色橡木仆从: {description: 深色橡木仆从, default: true}
  hcs.minions.type.樱花仆从: {description: 樱花仆从, default: true}
  hcs.minions.type.红树仆从: {description: 红树仆从, default: true}
  hcs.minions.type.骷髅仆从: {description: 骷髅猎人, default: true}
  hcs.minions.type.苦力怕仆从: {description: 苦力怕猎人, default: true}
  hcs.minions.type.蜘蛛仆从: {description: 蛛网猎人, default: true}
  hcs.minions.type.末影人仆从: {description: 末影猎人, default: true}
  hcs.minions.type.烈焰人仆从: {description: 烈焰猎人, default: true}
