# SkyMinions 配置 —— 启动时被 ConfigLoader 一次性反序列化为强类型 PluginConfig 记录。
# 运行时所有模块只读共享该不可变快照，严禁在业务代码中散落 getConfig()。

# 全局调度参数
tick-period: 20             # 全局调度器周期（tick）
max-checks-per-cycle: 48    # 单次策略执行方块检查硬上限（必须 < 50）
max-minions-per-player: 5   # 每玩家仆从槽位上限（Hypixel 默认 5）
# 固定仆从头颅贴图（base64 纹理，离线模式可用，皮肤未覆盖时的兜底）。留空则用默认。
# 从 minecraft-heads.com / mcheads.ru 等头颅库复制 Value 字段粘贴即可（注意值必须完整有效，
# 失效的纹理会导致客户端回退显示原版 Steve 头）。
head-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvOWFkMDlkZDVkOTQyYjZiZTZhZDYyMWYzYzNlYmJjNmM3MDFkNWMzMDQyZmFmYjJkNmJhM2ZjYTU0YTNjZDYxNyJ9fX0="

# 仆从皮肤纹理覆盖（可选）：键固定为 default/golden/diamond/halloween，
# 值为头颅库的 base64 Value。留空则使用内置纹理：golden/diamond 自带已验证贴图，
# default/halloween 回退上面的 head-texture。修改后 /minion reload 生效。
skins:
  default: ""
  golden: ""
  diamond: ""
  halloween: ""
# 调试日志：true 时打印仆从工作/搜索详情（排查用）
debug: false

# 升级玩法开关：true 时升级 Tier 除了材料还需消耗 1 个「当前等级的仆从生成物」本体
# （如 Tier1→2 需要 1 个 Tier1 仆从头颅 + 材料），对齐文档的合成升级玩法
upgrade-require-previous-body: true

# 收集解锁开关：true 时各类型需产物累计收集达到 unlock-amount 才解锁使用
# （未解锁时图鉴显示 ???，无法放置）；服主可关闭该限制
collection-unlock-enabled: true

# 玩家活动半径（方块）：半径内无玩家时仆从休眠不产出，对齐 Hypixel；0 = 永不休眠
player-scan-radius: 48

# 仆从间最小间距（水平切比雪夫距离，同世界）：防止工作区重叠；5 = 两个 5x5 恰好不重叠，0 = 不限制
min-placement-distance: 5

# 稀有掉落播报方式：true = 全服广播；false = 仅私聊通知主人
rare-drop-broadcast: true

database:
  type: sqlite               # sqlite | mysql
  sqlite-file: "minions.db"
  host: 127.0.0.1
  port: 3306
  database: minions
  user: root
  password: ""
  pool-size: 4              # HikariCP 连接池，小池避免虚拟线程被固定

economy:
  enabled: true             # 需要 Vault
  auto-sell-on-full: true   # 仓库满时自动售卖（也可通过「自动售卖漏斗」模块触发，对齐 Hypixel Hopper）
  sell-interval-ticks: 400  # 自动售卖轮询间隔
  price-multiplier: 1.0     # 全局价格倍率

# 燃料说明（Hypixel 对齐）：
#   限时燃料：COAL/CHARCOAL(+5%) COAL_BLOCK(+5%) LAVA_BUCKET(+25%) BLAZE_ROD(+30%)
#   永久燃料：MAGMA_CREAM(+30%) GLOWSTONE_DUST(+35%) DAYLIGHT_DETECTOR(+25%)  —— 不随时间衰减

# Collection 里程碑（Hypixel 采集里程碑玩法）：
#   每种资源累计量跨过阈值时达成里程碑：奖励金币（第 n 个 = coins-base × n），
#   命中 slot-milestones 序号的里程碑额外奖励仆从槽位 +1（多资源可叠加，
#   但总加成不超过 max-bonus-slots 硬上限，防止多资源叠加把经济玩坏）。
collections:
  enabled: true
  milestones: [50, 100, 250, 500, 1000, 2500, 5000, 10000]
  coins-base: 100
  slot-milestones: [3, 5, 7]
  max-bonus-slots: 5              # 里程碑槽位加成硬上限（默认权限上限 + 此加成 = 玩家可放置总数）

types:
  # 速率说明：动作间隔完全由 cooldown-ticks 逐级表决定（对齐 Hypixel 原版，燃料加速仍生效）；
  # efficiency-per-level 固定 0.0，避免等级额外提速破坏原版曲线。
  miner:
    display-name: "矿工仆从"
    max-level: 12
    base-efficiency: 1.0
    efficiency-per-level: 0.0
    base-fuel-ticks: 72000
    # 动作间隔（tick，逐级表，完全对齐 Hypixel Coal Minion I-XI：15/15/13/13/12/12/10/10/9/9/7s，第12级沿用XI）
    cooldown-ticks: [300, 300, 260, 260, 240, 240, 200, 200, 180, 180, 140, 140]
    sell-price-per-unit: 1.5
    product: COAL                 # 收集解锁产物
    # 升级配方：多材料（Tier1→2 基础数量），实际消耗 = 基础数量 × upgrade-cost-growth^(当前等级-1)
    # 材料键支持两种来源：
    #   · 原版材料：大写 Material 名（如 COBBLESTONE）
    #   · CraftEngine 自定义物品：键含冒号即识别，如 "craftengine:my_item": 8
    #     （未安装 CraftEngine 时该类材料无法匹配，建议仅在装了 CraftEngine 的服上启用）
    upgrade-recipe:
      COBBLESTONE: 64
      COAL: 32
      REDSTONE: 16
    upgrade-cost-growth: 1.25     # 每升一级材料量 ×1.25，陡增曲线
    base-radius: 2                # 固定工作半径（2 即 5x5，对齐 Hypixel 不随等级变）
    harvest-cap: 1                # 对齐 Hypixel：每次动作产 1 件；调大可恢复「布局奖励」玩法
    rare-drop: EMERALD            # 专属稀有掉落（可空 = 关闭）
    rare-drop-chance: 0.003       # 稀有掉落概率（0.003 = 0.3%）
    unlock-amount: 100            # 收集解锁：累计收集产物（product）达到此量才解锁（0 = 免解锁）
    targets: [COAL_ORE, IRON_ORE, COPPER_ORE, GOLD_ORE, DIAMOND_ORE, DEEPSLATE_COAL_ORE, DEEPSLATE_IRON_ORE, DEEPSLATE_COPPER_ORE, DEEPSLATE_GOLD_ORE, DEEPSLATE_DIAMOND_ORE, STONE, COBBLESTONE]
  farmer:
    display-name: "农夫仆从"
    max-level: 12
    base-efficiency: 1.0
    efficiency-per-level: 0.0
    base-fuel-ticks: 72000
    # 动作间隔（逐级表，完全对齐 Hypixel Wheat Minion I-XI：15/15/13/13/11/11/10/10/9/9/8s）
    cooldown-ticks: [300, 300, 260, 260, 220, 220, 200, 200, 180, 180, 160, 160]
    sell-price-per-unit: 0.8
    product: WHEAT
    upgrade-recipe:
      WHEAT: 64
      CARROT: 32
      PUMPKIN: 16
    upgrade-cost-growth: 1.25
    base-radius: 2
    harvest-cap: 1                # 对齐 Hypixel：每次动作产 1 件，作物不被破坏
    rare-drop: GOLDEN_CARROT
    rare-drop-chance: 0.005
    unlock-amount: 100
    targets: [WHEAT, CARROTS, POTATOES, BEETROOTS]
  lumberjack:
    display-name: "伐木工仆从"
    max-level: 12
    base-efficiency: 1.0
    efficiency-per-level: 0.0
    base-fuel-ticks: 72000
    # 动作间隔（逐级表，完全对齐 Hypixel Oak Minion I-XI：48/48/45/45/42/42/38/38/33/33/27s）
    cooldown-ticks: [960, 960, 900, 900, 840, 840, 760, 760, 660, 660, 540, 540]
    sell-price-per-unit: 1.0
    product: OAK_LOG
    upgrade-recipe:
      OAK_LOG: 64
      OAK_SAPLING: 32
      APPLE: 16
    upgrade-cost-growth: 1.25
    base-radius: 2
    rare-drop: GOLDEN_APPLE
    rare-drop-chance: 0.002
    unlock-amount: 150
    targets: [OAK_LOG, SPRUCE_LOG, BIRCH_LOG, JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG, MANGROVE_LOG, CHERRY_LOG]
    # 伐木工为真实挖掘：连锁砍整棵树，砍完自动在树根补种对应树苗
  fisher:
    display-name: "钓鱼仆从"
    max-level: 12
    base-efficiency: 1.0
    efficiency-per-level: 0.0
    base-fuel-ticks: 72000
    # 动作间隔（逐级表，Hypixel Fishing Minion T1=75s/T11=35s，中间按每级 -4s 插值）
    cooldown-ticks: [1500, 1420, 1340, 1260, 1180, 1100, 1020, 940, 860, 780, 700, 700]
    sell-price-per-unit: 2.0
    product: COD
    upgrade-recipe:
      COD: 48
      SALMON: 32
      STRING: 16
    upgrade-cost-growth: 1.25
    base-radius: 2
    rare-drop: NAUTILUS_SHELL
    rare-drop-chance: 0.01
    unlock-amount: 80
    targets: [WATER]              # canWork 检测附近是否有水
  slayer:
    display-name: "猎魔仆从"
    max-level: 12
    base-efficiency: 1.0
    efficiency-per-level: 0.0
    base-fuel-ticks: 72000
    # 动作间隔（逐级表，完全对齐 Hypixel Zombie Minion I-XI：26/26/24/24/22/22/20/20/17/17/13s）
    cooldown-ticks: [520, 520, 480, 480, 440, 440, 400, 400, 340, 340, 260, 260]
    sell-price-per-unit: 2.5
    product: ROTTEN_FLESH
    upgrade-recipe:
      ROTTEN_FLESH: 64
      BONE: 32
      STRING: 16
    upgrade-cost-growth: 1.25
    base-radius: 2
    rare-drop: WITHER_SKELETON_SKULL
    rare-drop-chance: 0.002
    unlock-amount: 200
    targets: []                   # 战斗型不受目标方块限制
  rancher:
    display-name: "牧民仆从"      # 纯模拟畜牧（对齐 Hypixel Cow/Chicken/Sheep）：
    max-level: 12                 # 每次工作随机一种动物按战利品表 roll 掉落，不生成动物实体
    base-efficiency: 1.0
    efficiency-per-level: 0.0
    base-fuel-ticks: 72000
    # 动作间隔（逐级表，完全对齐 Hypixel Cow Minion I-XI：26/26/24/24/22/22/20/20/17/17/13s）
    cooldown-ticks: [520, 520, 480, 480, 440, 440, 400, 400, 340, 340, 260, 260]
    sell-price-per-unit: 1.2
    product: BEEF
    upgrade-recipe:
      LEATHER: 32
      BEEF: 32
      WHEAT: 16
    upgrade-cost-growth: 1.25
    base-radius: 2
    rare-drop: SADDLE
    rare-drop-chance: 0.005
    unlock-amount: 150
    targets: []                   # 畜牧型不受目标方块限制（纯模拟产出牛羊鸡猪战利品）
  cobble:
    display-name: "圆石仆从"      # 生成器玩法（对齐 Hypixel Cobblestone Minion）：
    max-level: 12                 # 无圆石可采时在固体上方生成圆石，下次采掉，免搭刷石机
    base-efficiency: 1.0
    efficiency-per-level: 0.0
    base-fuel-ticks: 72000
    # 动作间隔（逐级表，完全对齐 Hypixel Cobblestone Minion I-XI：14/14/12/12/10/10/9/9/8/8/7s）
    cooldown-ticks: [280, 280, 240, 240, 200, 200, 180, 180, 160, 160, 140, 140]
    sell-price-per-unit: 0.3
    product: COBBLESTONE
    upgrade-recipe:
      COBBLESTONE: 64
      COAL: 16
    upgrade-cost-growth: 1.25
    base-radius: 2
    rare-drop: OBSIDIAN
    rare-drop-chance: 0.01
    unlock-amount: 250
    targets: []                   # 生成器型自带圆石循环
